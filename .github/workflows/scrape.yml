name: Fetch, Build and Publish

on:
  workflow_dispatch:
    inputs:
      full:
        description: "Fetch every legislature, not just the current one (takes hours; needed once to fill the raw store)"
        type: boolean
        default: false
  schedule:
    - cron: "37 2 * * *" # Every day at 2:37 UTC

permissions:
  contents: write

jobs:
  contract:
    # Checks the live API still matches schema/basis.schema.json.
    # A failure here means the Legislature changed something; the nightly job still runs.
    name: API contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:live

  nightly:
    name: Fetch, build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Raw objects never change, so a local copy saves downloading them again.
      - uses: actions/cache@v4
        with:
          path: .akleg-cache
          key: raw-objects-${{ github.run_id }}
          restore-keys: raw-objects-

      - name: Fetch new API responses into the raw store
        run: node src/cli.ts fetch --store r2 ${{ inputs.full && '--all' || '' }}

      - name: Build the tables and their history
        run: node src/cli.ts build --store r2 --out export

      - name: Build ak_leg.duckdb and Parquet files
        run: |
          curl -sSL -o duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.4.2/duckdb_cli-linux-amd64.zip
          unzip -q duckdb.zip -d "$RUNNER_TEMP"
          cd export && "$RUNNER_TEMP/duckdb" ak_leg.duckdb < ../scripts/build-duckdb.sql
          "$RUNNER_TEMP/duckdb" ak_leg.duckdb -c "SELECT 'bills' AS t, count(*) FROM bills UNION ALL SELECT 'votes', count(*) FROM votes UNION ALL SELECT 'choices', count(*) FROM choices UNION ALL SELECT 'billVersions', count(*) FROM billVersions"

      - name: Publish to R2 (published/<date>/ and published/latest/; the last 30 days are kept)
        run: node src/cli.ts publish --store r2 --dir export

      - name: Publish as the only GitHub release
        run: scripts/release.sh export
